name: Deploy grokcli-2api

# 触发模式：
#   - workflow_dispatch：手动触发
#   - push 到 main/master：当代码变更时自动触发
on:
  push:
    branches:
      - main
      - dev
    paths:
      - "**.go"
      - "**.py"
      - "Dockerfile"
      - "docker-compose.yml"
      - "deploy/**"
      - "scripts/**"
      - "grok2api/**"
      - "internal/**"
      - "cmd/**"
      - "contracts/**"
      - "turnstile-solver/**"
      - "grok-build-auth/**"
      - "static/**"
      - ".github/workflows/deploy-grokcli-2api.yml"
  workflow_dispatch:

concurrency:
  group: grokcli-2api-vm
  cancel-in-progress: false

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/grokcli-2api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=git-${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    environment:
      name: grokcli-2api-prod

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Sync runtime files to VM
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.GROKCLI_VM_HOST }}
          username: ${{ secrets.GROKCLI_VM_USER }}
          key: ${{ secrets.GROKCLI_VM_KEY }}
          password: ${{ secrets.GROKCLI_VM_PASSWORD }}
          port: ${{ secrets.GROKCLI_VM_SSH_PORT || '22' }}
          source: docker-compose.yml,Dockerfile,entrypoint.sh,start.sh,dev.sh,deploy/grok2api.service,scripts/g2a-hot-update-incontainer.sh,scripts/g2a-update-watcher.sh,scripts/g2a-update-watcher.service,.env.example
          target: ~/workspace/grokcli-2api
          strip_components: 0
          overwrite: true

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GROKCLI_VM_HOST }}
          username: ${{ secrets.GROKCLI_VM_USER }}
          key: ${{ secrets.GROKCLI_VM_KEY }}
          password: ${{ secrets.GROKCLI_VM_PASSWORD }}
          port: ${{ secrets.GROKCLI_VM_SSH_PORT || '22' }}
          timeout: 20m
          command_timeout: 20m
          script: |
            set -euo pipefail

            IMAGE='${{ env.IMAGE_NAME }}:git-${{ github.sha }}'
            APP_DIR="$HOME/workspace/grokcli-2api"

            pull_with_retry() {
              for i in 1 2 3 4 5; do
                echo "::group::Pull attempt $i"
                if docker pull "$1"; then
                  echo "::endgroup::"
                  echo "Pull OK: $1"
                  return 0
                fi
                echo "Pull failed, retrying in $((i * 15))s"
                echo "::endgroup::"
                sleep $((i * 15))
              done
              return 1
            }

            pull_with_retry "$IMAGE" || { echo "::error::failed to pull $IMAGE"; exit 1; }

            cd "$APP_DIR"

            # Ensure .env exists
            if [ ! -f .env ]; then
              cp .env.example .env
              echo "::notice::Created .env from .env.example"
            fi

            # Update image in docker-compose.yml
            export GROKCLI_2API_IMAGE="$IMAGE"

            docker compose pull
            docker compose up -d --remove-orphans --wait --wait-timeout 180
            HOST_PORT="$(docker compose port grokcli-2api 40081 | head -n 1 | sed 's/.*://')"
            curl -fsS "http://127.0.0.1:${HOST_PORT}/health" >/dev/null

            docker image prune -f >/dev/null 2>&1 || true
            echo "::notice::Deployed $IMAGE to $(hostname)"
